name: Kaivaryn validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chatgpt/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaivaryn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kaivaryn_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kaivaryn_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password
      STRIPE_PAYMENT_LINK: https://buy.stripe.com/14AaEZgJsdDNeTFePLeUU01
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      ACQUISITION_INGEST_TOKEN: ci-acquisition-token
      CLAY_WEBHOOK_SECRET: ci-clay-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Create CI database
        run: npx prisma db push
      - name: Seed CI database
        run: npm run db:seed
      - name: Acquisition validation
        run: npm run test:acquisition
      - name: Enterprise validation
        run: npm run test:enterprise
      - name: Production readiness validation
        run: npm run test:readiness
      - name: Production build
        run: npm run build
