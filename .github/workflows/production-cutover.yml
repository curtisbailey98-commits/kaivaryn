name: Kaivaryn Production Cutover

on:
  push:
    branches:
      - production-cutover-2026-09-23
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production archive
        shell: bash
        run: |
          echo "1f1e55d4dc3b50bb1e255e7ef8a98466c0969fc6588c372b45ee0c15f0ec5a1e  kaivaryn-production-ready.zip" | sha256sum --check --strict

      - name: Expand exact production tree
        shell: bash
        run: |
          set -euo pipefail
          cutover_dir="$RUNNER_TEMP/kaivaryn-cutover"
          mkdir -p "$cutover_dir"
          unzip -q kaivaryn-production-ready.zip -d "$cutover_dir"
          file_count="$(find "$cutover_dir" -type f | wc -l | tr -d ' ')"
          test "$file_count" = "145"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$cutover_dir"/. .

      - name: Validate production build
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaivaryn
          NEXTAUTH_SECRET: cutover-validation-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          BOOTSTRAP_ADMIN_PASSWORD: CutoverValidationOnly-2026!
        run: |
          npm ci
          npx prisma validate
          npm run build

      - name: Commit verified production tree
        shell: bash
        run: |
          git config user.name "Kaivaryn Production Cutover"
          git config user.email "kaivaryn-cutover@users.noreply.github.com"
          git add --all
          git commit -m "feat: cut over Kaivaryn to production PostgreSQL architecture"
          git push origin HEAD:production-cutover-2026-09-23
