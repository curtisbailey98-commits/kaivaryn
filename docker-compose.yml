services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaivaryn
    ports:
      - "5432:5432"
    volumes:
      - kaivaryn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaivaryn"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kaivaryn_postgres:
