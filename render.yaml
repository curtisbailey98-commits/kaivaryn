# Kaivaryn — Next.js web service backed by persistent PostgreSQL.
# DATABASE_URL is intentionally not committed. Point it at Supabase/Neon/Render Postgres.
services:
  - type: web
    name: kaivaryn
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: STRIPE_PAYMENT_LINK
        value: https://buy.stripe.com/14AaEZgJsdDNeTFePLeUU01
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ACQUISITION_INGEST_TOKEN
        sync: false
      - key: CLAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ACQUISITION_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ACQUISITION_SYNC_TOKEN
        generateValue: true
      - key: ACQUISITION_AUTOMATION_TOKEN
        generateValue: true
      - key: ACQUISITION_DAILY_EMAIL_LIMIT
        value: 25
      - key: ACQUISITION_CALL_MAX_TURNS
        value: 6
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CALL_MODEL
        value: gpt-5.6-luna
